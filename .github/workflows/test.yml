name: Reference checks
on: [push, pull_request, workflow_dispatch]
jobs:
  reference:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_source.py
      - run: python tools/check_layout.py
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_reference.py --output outputs/reference.json
      - run: python examples/run_example.py --output outputs/complete_example
      - run: python tools/summarize_results.py --output outputs/comparison
